<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defend Your Experience — Cross-Examination</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#05070d;
    --bg-alt:#0a0f1c;
    --panel: rgba(255,255,255,0.035);
    --panel-strong: rgba(255,255,255,0.065);
    --border:#1b2536;
    --border-hover:#2c3d57;
    --cyan:#00d4ff;
    --cyan-dim: rgba(0,212,255,0.12);
    --amber:#ffb020;
    --amber-dim: rgba(255,176,32,0.12);
    --red:#ff4d6d;
    --red-dim: rgba(255,77,109,0.13);
    --text:#e7edf6;
    --mute:#7d90a8;
    --faint:#3d4a60;
    --fd: 'Space Grotesk', sans-serif;
    --fm: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--fd);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(0,212,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.035) 1px, transparent 1px);
    background-size:44px 44px;
    pointer-events:none;
    z-index:0;
  }
  #app{position:relative; z-index:1; min-height:100vh;}
  a{color:var(--cyan);}
  button{font-family:var(--fd); cursor:pointer;}
  ::selection{background:rgba(0,212,255,0.25);}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#1c2738; border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--border-hover);}

  .eyebrow{
    font-family:var(--fm); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--cyan); display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:"◆"; font-size:8px;}
  .btn{
    border-radius:3px; padding:12px 22px; font-size:13px; font-weight:600;
    letter-spacing:.03em; border:1px solid var(--border-hover); background:var(--panel-strong);
    color:var(--text); transition:.15s ease; font-family:var(--fm);
  }
  .btn:hover{border-color:var(--cyan); color:var(--cyan); background:var(--cyan-dim);}
  .btn:disabled{opacity:.35; cursor:not-allowed; pointer-events:none;}
  .btn-primary{
    background:linear-gradient(135deg, rgba(0,212,255,0.18), rgba(123,47,255,0.10));
    border-color:rgba(0,212,255,0.45); color:#c8f4ff;
  }
  .btn-primary:hover{box-shadow:0 0 24px rgba(0,212,255,0.18); color:#fff;}
  .btn-danger{border-color:rgba(255,77,109,0.4); color:#ffb3c0;}
  .btn-danger:hover{border-color:var(--red); background:var(--red-dim); color:#ffd7de;}
  .btn-ghost{background:transparent; border-color:var(--border);}
  .mono{font-family:var(--fm);}
  .hidden{display:none !important;}

  /* ---------- Landing ---------- */
  .landing-wrap{max-width:980px; margin:0 auto; padding:64px 24px 100px;}
  .hero{text-align:center; margin-bottom:56px;}
  .hero-badge{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--fm); font-size:11px;
    letter-spacing:.2em; text-transform:uppercase; color:var(--amber);
    border:1px solid rgba(255,176,32,0.3); background:var(--amber-dim);
    padding:6px 16px; border-radius:2px; margin-bottom:26px;
  }
  .hero h1{
    font-size:clamp(32px,6vw,54px); font-weight:700; letter-spacing:-0.02em; margin:0 0 16px;
    line-height:1.05;
    background:linear-gradient(135deg,#ffffff 0%, var(--cyan) 55%, #7b6bff 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .hero p{font-size:16px; color:var(--mute); max-width:560px; margin:0 auto; line-height:1.7;}

  .steps{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:44px 0 48px;}
  .step{
    border:1px solid var(--border); background:var(--panel); border-radius:6px; padding:20px;
    position:relative;
  }
  .step .num{font-family:var(--fm); color:var(--faint); font-size:28px; font-weight:600; line-height:1;}
  .step h3{font-size:14px; margin:10px 0 6px; letter-spacing:.02em;}
  .step p{font-size:12.5px; color:var(--mute); line-height:1.6; margin:0;}
  .step:not(:last-child)::after{
    content:"→"; position:absolute; right:-19px; top:50%; transform:translateY(-50%);
    color:var(--faint); font-size:14px; display:none;
  }
  @media(min-width:720px){ .step:not(:last-child)::after{display:block;} }

  .panel{
    border:1px solid var(--border); background:var(--panel); border-radius:8px; padding:28px;
  }
  .upload-zone{
    border:1.5px dashed var(--border-hover); border-radius:8px; padding:44px 24px; text-align:center;
    background:rgba(255,255,255,0.015); transition:.15s;
  }
  .upload-zone.drag{border-color:var(--cyan); background:var(--cyan-dim);}
  .upload-zone .icon{font-size:30px; color:var(--cyan); margin-bottom:12px;}
  .upload-zone h3{margin:0 0 6px; font-size:15px;}
  .upload-zone p{margin:0; font-size:12.5px; color:var(--mute);}
  .upload-zone input{display:none;}
  .file-chip{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--fm); font-size:12px;
    background:var(--cyan-dim); border:1px solid rgba(0,212,255,.35); color:var(--cyan);
    padding:6px 12px; border-radius:3px; margin-top:14px;
  }
  .toggle-paste{
    display:block; text-align:center; margin-top:16px; font-size:12.5px; color:var(--mute);
    text-decoration:underline; cursor:pointer; background:none; border:none; font-family:var(--fd);
  }
  .toggle-paste:hover{color:var(--cyan);}
  textarea{
    width:100%; background:rgba(0,0,0,0.25); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--fm); font-size:13px; padding:14px; resize:vertical;
    line-height:1.6;
  }
  textarea:focus{outline:none; border-color:var(--cyan);}
  label.field-label{font-family:var(--fm); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); display:block; margin-bottom:8px;}

  .dial-row{display:flex; gap:8px; flex-wrap:wrap;}
  .dial-opt{
    flex:1; min-width:110px; border:1px solid var(--border); background:var(--panel); border-radius:5px;
    padding:12px 10px; text-align:center; font-family:var(--fm); font-size:11.5px; letter-spacing:.06em;
    color:var(--mute); transition:.15s;
  }
  .dial-opt.active{border-color:var(--red); color:#ffd7de; background:var(--red-dim);}
  .dial-opt:hover{border-color:var(--border-hover); color:var(--text);}

  .section-gap{margin-top:26px;}

  .history-list{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .history-item{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    border:1px solid var(--border); border-radius:6px; padding:12px 16px; background:var(--panel);
  }
  .history-item .hmeta{font-size:12px; color:var(--mute); font-family:var(--fm);}
  .score-pill{
    font-family:var(--fm); font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px;
  }

  /* ---------- Interview screen ---------- */
  .exam-shell{display:grid; grid-template-columns:260px 1fr; min-height:100vh;}
  @media(max-width:860px){ .exam-shell{grid-template-columns:1fr;} .sidebar{order:2;} }
  .sidebar{
    border-right:1px solid var(--border); background:var(--bg-alt); padding:22px 18px; position:sticky; top:0;
    height:100vh; overflow-y:auto;
  }
  @media(max-width:860px){ .sidebar{position:relative; height:auto;} }
  .case-title{font-family:var(--fm); font-size:11px; letter-spacing:.16em; color:var(--faint); text-transform:uppercase; margin-bottom:4px;}
  .case-name{font-size:16px; font-weight:600; margin-bottom:18px;}
  .overall-box{
    border:1px solid var(--border); border-radius:6px; padding:14px; margin-bottom:20px; background:var(--panel);
  }
  .overall-box .lbl{font-family:var(--fm); font-size:10.5px; color:var(--mute); letter-spacing:.1em; text-transform:uppercase; margin-bottom:8px;}
  .progress-track{height:6px; background:#101828; border-radius:4px; overflow:hidden; margin-bottom:8px;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--cyan),#7b6bff); transition:width .4s ease;}
  .overall-num{font-family:var(--fm); font-size:20px; font-weight:600;}
  .pressure-badge{
    display:inline-block; font-family:var(--fm); font-size:10.5px; letter-spacing:.12em; padding:3px 9px;
    border-radius:20px; text-transform:uppercase; margin-top:8px; font-weight:600;
  }
  .exhibits-lbl{font-family:var(--fm); font-size:10.5px; letter-spacing:.16em; color:var(--faint); text-transform:uppercase; margin:18px 0 10px;}
  .exhibit-card{
    border:1px solid var(--border); border-radius:5px; padding:10px 12px; margin-bottom:8px;
    background:var(--panel); transition:.15s;
  }
  .exhibit-card.current{border-color:var(--cyan); box-shadow:0 0 0 1px rgba(0,212,255,0.15);}
  .exhibit-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .exhibit-tag{font-family:var(--fm); font-size:10px; letter-spacing:.08em; color:var(--faint);}
  .exhibit-status{font-family:var(--fm); font-size:9.5px; letter-spacing:.06em; padding:2px 7px; border-radius:10px; text-transform:uppercase; font-weight:600;}
  .exhibit-text{font-size:11.5px; color:var(--mute); line-height:1.5; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .exhibit-bar{height:4px; background:#101828; border-radius:3px; margin-top:8px; overflow:hidden;}
  .exhibit-bar-fill{height:100%; transition:width .5s ease;}

  .exam-main{display:flex; flex-direction:column; height:100vh;}
  @media(max-width:860px){ .exam-main{height:auto;} }
  .exam-header{
    display:flex; justify-content:space-between; align-items:center; padding:16px 26px;
    border-bottom:1px solid var(--border); background:rgba(5,7,13,0.85); backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:5;
  }
  .exam-header h2{font-size:14px; margin:0; letter-spacing:.02em;}
  .exam-header .sub{font-family:var(--fm); font-size:11px; color:var(--faint);}
  .transcript{
    flex:1; overflow-y:auto; padding:28px 26px; display:flex; flex-direction:column; gap:16px; max-width:840px; width:100%; margin:0 auto;
  }
  .msg{max-width:88%; border-radius:8px; padding:14px 16px; font-size:13.5px; line-height:1.65; position:relative;}
  .msg .who{font-family:var(--fm); font-size:10px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:6px; display:flex; align-items:center; gap:8px;}
  .msg.examiner{align-self:flex-start; background:var(--red-dim); border:1px solid rgba(255,77,109,0.28);}
  .msg.examiner .who{color:var(--red);}
  .msg.user{align-self:flex-end; background:var(--cyan-dim); border:1px solid rgba(0,212,255,0.28);}
  .msg.user .who{color:var(--cyan);}
  .coach-note{
    align-self:flex-start; max-width:88%; font-family:var(--fm); font-size:11.5px; color:var(--amber);
    background:var(--amber-dim); border:1px dashed rgba(255,176,32,0.4); border-radius:6px; padding:8px 12px;
  }
  .coach-note b{letter-spacing:.06em;}
  .system-line{
    align-self:center; font-family:var(--fm); font-size:11px; color:var(--faint); text-align:center;
  }
  .exam-input{
    border-top:1px solid var(--border); padding:16px 26px 22px; background:rgba(5,7,13,0.9);
    max-width:840px; width:100%; margin:0 auto;
  }
  .exam-input textarea{min-height:64px;}
  .exam-input-row{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;}
  .exam-input-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .char-count{font-family:var(--fm); font-size:10.5px; color:var(--faint);}
  .typing-dots{display:inline-flex; gap:4px; align-items:center;}
  .typing-dots span{width:5px; height:5px; border-radius:50%; background:var(--red); animation:blink 1.1s infinite ease-in-out;}
  .typing-dots span:nth-child(2){animation-delay:.15s;}
  .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}
  .error-banner{
    background:var(--red-dim); border:1px solid rgba(255,77,109,.4); border-radius:6px; padding:12px 16px;
    font-size:12.5px; color:#ffd7de; display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px;
  }

  /* ---------- Report screen ---------- */
  .report-wrap{max-width:900px; margin:0 auto; padding:56px 24px 100px;}
  .gauge-wrap{display:flex; flex-direction:column; align-items:center; margin:20px 0 40px;}
  .gauge-num{font-family:var(--fm); font-size:56px; font-weight:600; line-height:1;}
  .gauge-lbl{font-family:var(--fm); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--mute); margin-top:6px;}
  .verdict-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:30px 0 40px;}
  @media(max-width:700px){.verdict-grid{grid-template-columns:1fr;}}
  .verdict-box{border:1px solid var(--border); border-radius:8px; padding:18px; background:var(--panel);}
  .verdict-box h4{margin:0 0 10px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-family:var(--fm);}
  .verdict-box ul{margin:0; padding-left:16px; font-size:12.5px; color:var(--mute); line-height:1.7;}
  .claim-report-card{border:1px solid var(--border); border-radius:8px; padding:20px; margin-bottom:14px; background:var(--panel);}
  .claim-report-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px;}
  .claim-report-top .txt{font-size:14px; font-weight:600; line-height:1.5;}
  .status-tag{font-family:var(--fm); font-size:10px; letter-spacing:.08em; padding:3px 10px; border-radius:20px; text-transform:uppercase; font-weight:700; white-space:nowrap;}
  .claim-report-card p{font-size:13px; color:var(--mute); line-height:1.7; margin:6px 0;}
  .claim-report-card .tip{color:var(--amber); font-size:12.5px; border-left:2px solid rgba(255,176,32,.4); padding-left:10px; margin-top:10px;}
  .claim-report-card .story{color:var(--cyan); font-size:12.5px; border-left:2px solid rgba(0,212,255,.4); padding-left:10px; margin-top:8px;}
  .report-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:36px; justify-content:center;}

  .top-bar-fixed{
    position:sticky; top:0; z-index:6; display:flex; justify-content:space-between; align-items:center;
    padding:14px 24px; border-bottom:1px solid var(--border); background:rgba(5,7,13,0.85); backdrop-filter:blur(6px);
  }
  .top-bar-fixed .brand{font-family:var(--fm); font-size:12px; letter-spacing:.14em; color:var(--faint); text-transform:uppercase;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= STATE ============================= */
const LS_ACTIVE = "dye_active_session_v1";
const LS_HISTORY = "dye_history_v1";
const MODEL = "claude-sonnet-4-6";

let state = {
  screen: "landing",          // landing | interview | report | history
  resumeText: "",
  fileName: "",
  showPaste: false,
  difficulty: "brutal",       // warmup | standard | hard | brutal
  claims: [],                 // {id, text, category, risk_level, status, confidence}
  currentClaimId: null,
  messages: [],                // full API message history for interview loop
  transcriptUI: [],            // rendered turns: {type:'examiner'|'user'|'coach'|'system', text, meta}
  loading: false,
  loadingStage: "",
  error: null,
  report: null,
  viewingPastId: null,
  exchangesOnCurrentClaim: 0,
  claimsCovered: 0,
};

function saveActive(){
  try{ localStorage.setItem(LS_ACTIVE, JSON.stringify(state)); }catch(e){}
}
function clearActive(){
  try{ localStorage.removeItem(LS_ACTIVE); }catch(e){}
}
function loadActive(){
  try{
    const raw = localStorage.getItem(LS_ACTIVE);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function getHistory(){
  try{
    return JSON.parse(localStorage.getItem(LS_HISTORY) || "[]");
  }catch(e){ return []; }
}
function pushHistory(entry){
  const h = getHistory();
  h.unshift(entry);
  localStorage.setItem(LS_HISTORY, JSON.stringify(h.slice(0,25)));
}

function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}

/* ============================= API ============================= */
async function claudeCall(system, messages, {retries=3}={}){
  let attempt = 0;
  let lastErr = null;
  while(attempt <= retries){
    try{
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model: MODEL,
          max_tokens: 1000,
          system: system,
          messages: messages
        })
      });
      if(res.status === 429 || res.status === 529 || res.status >= 500){
        throw { retryable:true, status:res.status };
      }
      if(!res.ok){
        const t = await res.text().catch(()=> "");
        throw { retryable:false, status:res.status, detail:t };
      }
      const data = await res.json();
      const text = (data.content||[]).map(b=>b.text||"").join("\n");
      return text;
    }catch(err){
      lastErr = err;
      if(err && err.retryable && attempt < retries){
        state.loadingStage = `The examiner's line is busy — retrying (${attempt+1}/${retries})…`;
        render();
        await new Promise(r=>setTimeout(r, 900 * Math.pow(2, attempt)));
        attempt++;
        continue;
      }
      throw lastErr;
    }
  }
  throw lastErr;
}

function parseJsonLoose(text){
  let cleaned = text.trim();
  cleaned = cleaned.replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
  const first = cleaned.indexOf("{");
  const last = cleaned.lastIndexOf("}");
  if(first !== -1 && last !== -1){
    cleaned = cleaned.slice(first, last+1);
  }
  return JSON.parse(cleaned);
}

/* ============================= PROMPTS ============================= */
function extractSystemPrompt(){
  return `You are a resume claim-extraction engine that powers a mock cross-examination tool called "Defend Your Experience".
Given raw resume/profile text, identify every distinct factual or evaluative claim the candidate makes about themselves: skills, named projects, achievements, metrics, responsibilities, tools, soft claims ("strong communicator", "led a team", etc).
Return ONLY valid JSON, no markdown fences, no prose before or after, matching exactly this shape:
{"claims":[{"id":"c1","text":"<verbatim or near-verbatim phrase copied from the source>","category":"project|skill|metric|experience|soft-claim","risk_level":"low|medium|high"}]}
Rules:
- risk_level "high" = vague, unquantified, buzzwordy, or impressive-sounding claims most likely to collapse under scrutiny.
- risk_level "low" = modest, well-scoped, easily evidenced claims.
- Extract between 6 and 14 claims. Order the array by risk_level descending (high risk first).
- ids must be c1, c2, c3... in that same order.
- Do not invent claims that are not supported by the text.`;
}

function interviewSystemPrompt(){
  const difficultyDesc = {
    warmup: "Mostly supportive. Point out gaps gently, give the candidate room to think, only mild pressure.",
    standard: "Normal interview pressure. Push for specifics, don't let vague answers slide, but stay measured.",
    hard: "Sharp and skeptical throughout. Rarely satisfied on the first answer. Push for numbers, ownership, and specifics every time.",
    brutal: "Hostile and relentless. Assume every claim is exaggerated until proven otherwise with hard specifics. Interrupt vagueness immediately, call out buzzwords by name, demand exact numbers, exact tools, exact percentage of work that was actually theirs. Never fully satisfied — even strong answers get one more sharp follow-up before you move on."
  };
  return `You are "THE EXAMINER" — an elite, hostile skeptic running a mock cross-examination for a tool called "Defend Your Experience". Your job is NOT to be nice. Your job is to find every weak point in this candidate's resume claims before a real interviewer does.

You combine the harshest instincts of: a skeptical recruiter screening for red flags, a deep technical hiring manager who has shipped real AI/GenAI systems, and a no-nonsense startup investor doing founder due diligence. The candidate is targeting AI/GenAI internship and early-career roles.

DIFFICULTY SETTING: ${state.difficulty.toUpperCase()} — ${difficultyDesc[state.difficulty] || difficultyDesc.brutal}

CLAIMS UNDER EXAMINATION (the "exhibits" — extracted from the candidate's own resume):
${JSON.stringify(state.claims.map(c=>({id:c.id, text:c.text, category:c.category, risk_level:c.risk_level})))}

STRICT OUTPUT RULES:
- Respond with ONLY a single valid JSON object. No markdown fences, no commentary outside the JSON.
- For a normal turn use exactly this schema:
{"type":"question","claim_id":"<id from the exhibit list above, or 'general'>","claim_text":"<verbatim text of the exhibit currently under attack>","verdict_on_previous":"n/a|solid|weak|evasive|improved","confidence_score":<integer 0-100, your updated cumulative confidence that the candidate can defend THIS exhibit in a real interview>,"examiner_reaction":"<1-2 sentence in-character hostile reaction to their previous answer; if this is the opening question, briefly explain why you're starting with this exhibit>","question":"<the next sharp, specific, hostile question — must reference the candidate's own resume wording or their own prior answer, never a generic template question>","pressure_level":"warmup|standard|hard|brutal","internal_note":"<one clear, out-of-character coaching tip: exactly what evidence, number, or specificity is still missing>"}
- Never ask generic interview-prep questions like "tell me about a time you...". Always anchor the question in specific words from THEIR resume or THEIR previous answer.
- Spend 2-4 exchanges per exhibit, then move to the next one. Prioritize high risk_level exhibits first.
- Escalate pressure when answers are vague or evasive. Ease only slightly on genuinely strong, specific, evidenced answers — but always return sharp on the next exhibit.
- If the candidate explicitly concedes they have no evidence, mark verdict_on_previous "weak", set a low confidence_score, and move on.
- When every exhibit has been reasonably probed, OR the candidate asks to end the session, respond ONLY with this report schema instead:
{"type":"report","overall_readiness":<integer 0-100>,"claims":[{"claim_id":"...","claim_text":"...","status":"well-defended|needs-work|weak","confidence_score":<0-100>,"summary":"<2-3 sentence honest assessment of how they defended this exhibit>","improvement_tip":"<concrete, specific action to close the gap>","suggested_story_structure":"<a short concrete Situation/Task/Action/Result-style skeleton using THEIR real details>"}],"top_risks":["<the sharpest weaknesses a real interviewer would exploit>"],"strongest_moments":["<specific moments/exhibits they genuinely defended well>"],"next_steps":["<concrete prep actions before a real interview>"]}
- Attack the CLAIM, never the person's character or worth. No personal insults, no discouragement — sharp, professional, relentless pressure only.`;
}

/* ============================= FLOW ============================= */
async function runExtraction(){
  state.loading = true;
  state.loadingStage = "Reading the file and building the case…";
  state.error = null;
  render();
  try{
    const raw = await claudeCall(extractSystemPrompt(), [{role:"user", content: state.resumeText}]);
    const parsed = parseJsonLoose(raw);
    const claims = (parsed.claims||[]).map(c=>({
      id: c.id, text: c.text, category: c.category||"claim", risk_level: c.risk_level||"medium",
      status:"pending", confidence:0
    }));
    if(claims.length === 0){ throw {retryable:false, detail:"No claims extracted"}; }
    state.claims = claims;
    state.currentClaimId = claims[0].id;
    state.messages = [{role:"user", content:
      `Here is my resume/profile text. Begin the cross-examination now with your opening question on the highest-risk exhibit.\n\n---\n${state.resumeText}\n---`}];
    state.screen = "interview";
    state.loading = false;
    saveActive();
    render();
    await runExamTurn();
  }catch(err){
    state.loading = false;
    state.error = "Couldn't extract claims from that text. Try pasting cleaner plain text, or try again.";
    render();
  }
}

async function runExamTurn(){
  state.loading = true;
  state.loadingStage = "The examiner is reviewing your answer…";
  state.error = null;
  render();
  try{
    const raw = await claudeCall(interviewSystemPrompt(), state.messages);
    state.messages.push({role:"assistant", content: raw});
    const parsed = parseJsonLoose(raw);
    if(parsed.type === "report"){
      finalizeReport(parsed);
    }else{
      applyQuestionTurn(parsed);
    }
    state.loading = false;
    saveActive();
    render();
  }catch(err){
    state.loading = false;
    state.error = "The examiner hit a snag reaching the API (rate limit or temporary error). Try again.";
    render();
  }
}

function applyQuestionTurn(t){
  if(t.examiner_reaction && state.transcriptUI.length > 0){
    state.transcriptUI.push({type:"examiner", text: t.examiner_reaction, meta:{tag:"REACTION"}});
  }
  if(t.claim_id && t.claim_id !== "general"){
    let c = state.claims.find(x=>x.id === t.claim_id);
    if(c){
      if(c.status === "pending"){ state.claimsCovered++; }
      c.status = "in-progress";
      c.confidence = clamp(t.confidence_score||0,0,100);
      state.currentClaimId = c.id;
    }
  }
  state.transcriptUI.push({type:"examiner", text: t.question, meta:{tag:"QUESTION", pressure: t.pressure_level}});
  if(t.internal_note){
    state.transcriptUI.push({type:"coach", text: t.internal_note});
  }
}

function finalizeReport(r){
  r.claims = r.claims || [];
  r.claims.forEach(rc=>{
    const c = state.claims.find(x=>x.id === rc.claim_id);
    if(c){
      c.status = rc.status === "well-defended" ? "defended" : (rc.status === "weak" ? "weak" : "needs-work");
      c.confidence = clamp(rc.confidence_score||c.confidence,0,100);
    }
  });
  state.report = r;
  state.screen = "report";
  pushHistory({
    id: Date.now(),
    date: Date.now(),
    resumeSnippet: state.resumeText.slice(0,140),
    overallReadiness: r.overall_readiness,
    report: r,
    claims: state.claims,
    transcriptUI: state.transcriptUI
  });
  clearActive();
}

async function sendAnswer(text, isObjection){
  if(!text.trim() && !isObjection) return;
  const displayText = isObjection ? "[No hard evidence — I don't have a strong answer for this one.]" : text;
  state.transcriptUI.push({type:"user", text: displayText});
  state.messages.push({role:"user", content: isObjection ?
    "[Candidate concedes they have no strong evidence for this exhibit. Mark it weak and move to the next exhibit.]" : text});
  render();
  await runExamTurn();
}

async function endEarly(){
  state.transcriptUI.push({type:"system", text:"Cross-examination ended early by candidate. Compiling verdict…"});
  state.messages.push({role:"user", content:"[Candidate requests to end the session now. Generate the final report based on everything covered so far.]"});
  render();
  await runExamTurn();
}

/* ============================= FILE HANDLING ============================= */
async function handleFile(file){
  state.fileName = file.name;
  state.error = null;
  render();
  const ext = file.name.split(".").pop().toLowerCase();
  try{
    if(ext === "txt" || ext === "md"){
      const text = await file.text();
      state.resumeText = text;
      state.showPaste = true;
    }else if(ext === "pdf"){
      const buf = await file.arrayBuffer();
      if(window.pdfjsLib){
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        const doc = await pdfjsLib.getDocument({data: buf}).promise;
        let full = "";
        for(let i=1;i<=doc.numPages;i++){
          const page = await doc.getPage(i);
          const content = await page.getTextContent();
          full += content.items.map(it=>it.str).join(" ") + "\n";
        }
        state.resumeText = full.trim();
        state.showPaste = true;
      }else{
        throw new Error("pdf.js unavailable");
      }
    }else{
      state.error = "That file type isn't auto-readable. Paste your resume text below instead.";
      state.showPaste = true;
    }
  }catch(e){
    state.error = "Couldn't extract text from that file automatically. Paste your resume text below instead.";
    state.showPaste = true;
  }
  render();
}

/* ============================= EXPORT ============================= */
function exportReport(){
  if(!state.report) return;
  const r = state.report;
  let md = `# Defense Report\n\nGenerated ${new Date().toLocaleString()}\n\n**Overall Readiness: ${r.overall_readiness}/100**\n\n`;
  md += `## Exhibit-by-Exhibit Verdict\n\n`;
  r.claims.forEach(c=>{
    md += `### ${c.claim_text}\n- Status: ${c.status}\n- Confidence: ${c.confidence_score}/100\n- Summary: ${c.summary}\n- Improvement tip: ${c.improvement_tip}\n- Suggested story: ${c.suggested_story_structure}\n\n`;
  });
  md += `## Top Risks\n${(r.top_risks||[]).map(x=>"- "+x).join("\n")}\n\n`;
  md += `## Strongest Moments\n${(r.strongest_moments||[]).map(x=>"- "+x).join("\n")}\n\n`;
  md += `## Next Steps\n${(r.next_steps||[]).map(x=>"- "+x).join("\n")}\n`;
  const blob = new Blob([md], {type:"text/markdown"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "defense-report.md";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function statusColor(status){
  if(status === "defended") return {bg:"var(--cyan-dim)", bd:"rgba(0,212,255,.4)", fg:"var(--cyan)", label:"SECURE"};
  if(status === "in-progress") return {bg:"var(--amber-dim)", bd:"rgba(255,176,32,.4)", fg:"var(--amber)", label:"UNDER FIRE"};
  if(status === "weak") return {bg:"var(--red-dim)", bd:"rgba(255,77,109,.4)", fg:"var(--red)", label:"EXPOSED"};
  if(status === "needs-work") return {bg:"var(--amber-dim)", bd:"rgba(255,176,32,.4)", fg:"var(--amber)", label:"SHAKY"};
  return {bg:"rgba(255,255,255,0.03)", bd:"var(--border)", fg:"var(--faint)", label:"UNTESTED"};
}

  const active = loadActive();
  if(active && active.screen === "interview" && active.claims && active.claims.length){
    state = Object.assign(state, active);
  }
  render();
})();
</script>
